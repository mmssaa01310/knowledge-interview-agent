<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">KIKO Thinking</title>
  <desc id="desc">KIKO in thinking state with symmetric upward-looking eyes, denser knowledge orbits, and three outlined thought bubbles clearly separated from the knowledge nodes.</desc>

  <defs>
    <radialGradient id="coreFill" cx="42%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2FBFF"/>
      <stop offset="100%" stop-color="#D9F1FF"/>
    </radialGradient>

    <linearGradient id="shellFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D8CFF"/>
      <stop offset="48%" stop-color="#3CB6F8"/>
      <stop offset="100%" stop-color="#66E7B7"/>
    </linearGradient>

    <linearGradient id="orbit1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66E7B7"/>
      <stop offset="55%" stop-color="#3CB6F8"/>
      <stop offset="100%" stop-color="#7B83F7"/>
    </linearGradient>

    <linearGradient id="orbit2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9AE8FF"/>
      <stop offset="45%" stop-color="#52AEFF"/>
      <stop offset="100%" stop-color="#7EE3C0"/>
    </linearGradient>

    <linearGradient id="orbit3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8D8AF9"/>
      <stop offset="52%" stop-color="#56B2FF"/>
      <stop offset="100%" stop-color="#6DE5C1"/>
    </linearGradient>

    <radialGradient id="nodeBlue" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#7DE2FF"/>
      <stop offset="48%" stop-color="#35A7FF"/>
      <stop offset="100%" stop-color="#1D6EEA"/>
    </radialGradient>

    <radialGradient id="nodeMint" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#D0FFF0"/>
      <stop offset="45%" stop-color="#74E8C8"/>
      <stop offset="100%" stop-color="#2FBE95"/>
    </radialGradient>

    <radialGradient id="nodeViolet" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#D7D5FF"/>
      <stop offset="50%" stop-color="#9A90FF"/>
      <stop offset="100%" stop-color="#6E62E8"/>
    </radialGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.08
                0 0 0 0 0.26
                0 0 0 0 0.46
                0 0 0 0.18 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="512" cy="804" rx="190" ry="36" fill="#1C6BE8" opacity="0.10"/>

  <!-- rear orbital rings -->
  <ellipse cx="512" cy="490" rx="330" ry="150"
           transform="rotate(-15 512 490)"
           fill="none" stroke="url(#orbit1)" stroke-width="22" stroke-linecap="round" opacity="0.80"/>

  <ellipse cx="512" cy="500" rx="300" ry="116"
           transform="rotate(33 512 500)"
           fill="none" stroke="url(#orbit2)" stroke-width="16" stroke-linecap="round" opacity="0.58"/>

  <ellipse cx="512" cy="494" rx="278" ry="134"
           transform="rotate(-52 512 494)"
           fill="none" stroke="url(#orbit3)" stroke-width="14" stroke-linecap="round" opacity="0.42"/>

  <!-- back nodes -->
  <g filter="url(#nodeShadow)">
    <circle cx="300" cy="330" r="34" fill="url(#nodeBlue)"/>
    <circle cx="683" cy="334" r="24" fill="url(#nodeMint)"/>
    <circle cx="780" cy="468" r="36" fill="url(#nodeViolet)"/>
    <circle cx="319" cy="628" r="22" fill="url(#nodeViolet)"/>
    <circle cx="659" cy="694" r="32" fill="url(#nodeMint)"/>
  </g>

  <!-- body -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="500" r="214" fill="url(#shellFill)"/>
    <circle cx="512" cy="500" r="178" fill="url(#coreFill)"/>
  </g>

  <!-- shell highlight -->
  <path d="M390 350 C448 310 567 303 628 336"
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.34"/>

  <!-- eyes: thinking, same visual language as waiting state -->
  <ellipse cx="462" cy="486" rx="20" ry="33" fill="#0A3268"/>
  <ellipse cx="574" cy="486" rx="20" ry="33" fill="#0A3268"/>
  <ellipse cx="468" cy="472" rx="6" ry="10" fill="#FFFFFF" opacity="0.52"/>
  <ellipse cx="580" cy="472" rx="6" ry="10" fill="#FFFFFF" opacity="0.52"/>

  <!-- front orbital ring -->
  <path d="M216 553 C336 682 587 720 790 620 C849 591 874 555 882 521"
        fill="none" stroke="url(#orbit1)" stroke-width="28" stroke-linecap="round"/>

  <!-- front nodes -->
  <g filter="url(#nodeShadow)">
    <circle cx="214" cy="548" r="29" fill="url(#nodeMint)"/>
    <circle cx="836" cy="553" r="30" fill="url(#nodeBlue)"/>
    <circle cx="592" cy="752" r="18" fill="url(#nodeBlue)"/>
    <circle cx="736" cy="738" r="14" fill="url(#nodeViolet)"/>
  </g>
  <!-- thought bubbles: intentionally distinct from knowledge nodes -->
  <g aria-label="thinking bubbles">
    <circle cx="752" cy="292" r="10"
            fill="#F8FCFF" stroke="#8BCBFF" stroke-width="5"/>
    <circle cx="795" cy="252" r="18"
            fill="#F8FCFF" stroke="#8BCBFF" stroke-width="6"/>
    <circle cx="850" cy="196" r="31"
            fill="#F8FCFF" stroke="#8BCBFF" stroke-width="7"/>
  </g>

</svg>
