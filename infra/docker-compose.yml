services:
  api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile.dev
    working_dir: /workspace/app/api
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-ap-northeast-1}
      AWS_SDK_LOAD_CONFIG: "1"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      DEV_AUTO_SEED_VOICE_DEMO: ${DEV_AUTO_SEED_VOICE_DEMO:-true}
      DEV_AUTO_SEED_MAINTENANCE_DEMO: ${DEV_AUTO_SEED_MAINTENANCE_DEMO:-true}
      DEV_AUTO_SEED_SYSTEM_REQUIREMENT_DEMO: ${DEV_AUTO_SEED_SYSTEM_REQUIREMENT_DEMO:-true}
      QUESTION_DESIGN_TEMPERATURE: ${QUESTION_DESIGN_TEMPERATURE:-0.0}
      STRUCTURED_INTERVIEW_ENABLED: ${STRUCTURED_INTERVIEW_ENABLED:-true}
      STRUCTURED_INTERVIEW_MODEL_ID: ${STRUCTURED_INTERVIEW_MODEL_ID:-global.openai.gpt-5.6-terra}
      STRUCTURED_INTERVIEW_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_REASONING_EFFORT:-low}
      STRUCTURED_INTERVIEW_MEDIUM_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_MEDIUM_REASONING_EFFORT:-medium}
      STRUCTURED_INTERVIEW_MAX_OUTPUT_TOKENS: ${STRUCTURED_INTERVIEW_MAX_OUTPUT_TOKENS:-6000}
      STRUCTURED_INTERVIEW_QUESTION_MAX_OUTPUT_TOKENS: ${STRUCTURED_INTERVIEW_QUESTION_MAX_OUTPUT_TOKENS:-600}
      QUESTION_DESIGN_MODEL_ID: ${QUESTION_DESIGN_MODEL_ID:-global.openai.gpt-5.6-terra}
      STRUCTURED_INTERVIEW_CONNECT_TIMEOUT_SECONDS: ${STRUCTURED_INTERVIEW_CONNECT_TIMEOUT_SECONDS:-5}
      STRUCTURED_INTERVIEW_READ_TIMEOUT_SECONDS: ${STRUCTURED_INTERVIEW_READ_TIMEOUT_SECONDS:-120}
      VOICE_BEDROCK_MODEL_ID: ${VOICE_BEDROCK_MODEL_ID:-apac.amazon.nova-pro-v1:0}
      VOICE_BEDROCK_TEMPERATURE: ${VOICE_BEDROCK_TEMPERATURE:-0.0}
      VOICE_BEDROCK_MAX_TOKENS: ${VOICE_BEDROCK_MAX_TOKENS:-600}
      VOICE_ANSWER_EVALUATION_DEADLINE_SECONDS: ${VOICE_ANSWER_EVALUATION_DEADLINE_SECONDS:-2.0}
      VOICE_BEDROCK_CONNECT_TIMEOUT_SECONDS: ${VOICE_BEDROCK_CONNECT_TIMEOUT_SECONDS:-0.5}
      VOICE_BEDROCK_READ_TIMEOUT_SECONDS: ${VOICE_BEDROCK_READ_TIMEOUT_SECONDS:-1.8}
      VOICE_BEDROCK_WARMUP_ENABLED: ${VOICE_BEDROCK_WARMUP_ENABLED:-true}
    ports:
      - "${API_PORT:-8001}:8000"
    dns:
      - "${DOCKER_DNS_SERVER:-172.21.96.1}"
    volumes:
      - ..:/workspace
      - ${HOME}/.aws:/root/.aws:ro

  voice:
    build:
      context: ..
      dockerfile: app/voice/Dockerfile.dev
    working_dir: /workspace/app/voice
    network_mode: host
    depends_on:
      - api
    environment:
      APP_ENV: ${APP_ENV:-local}
      VOICE_API_BASE_URL: http://127.0.0.1:${API_PORT:-8001}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
      AWS_SDK_LOAD_CONFIG: "1"
      VOICE_KVS_TURN_CHANNEL_ARN: ${VOICE_KVS_TURN_CHANNEL_ARN:-}
      NOVA_SONIC_MODEL_ID: ${NOVA_SONIC_MODEL_ID:-amazon.nova-2-sonic-v1:0}
      NOVA_SONIC_VOICE_ID: ${NOVA_SONIC_VOICE_ID:-matthew}
      TRANSCRIBE_LANGUAGE_CODE: ${TRANSCRIBE_LANGUAGE_CODE:-ja-JP}
      TRANSCRIBE_PARTIAL_RESULTS_STABILITY: ${TRANSCRIBE_PARTIAL_RESULTS_STABILITY:-medium}
      TRANSCRIBE_AUDIO_CHUNK_MS: ${TRANSCRIBE_AUDIO_CHUNK_MS:-100}
      TRANSCRIBE_RECONNECT_ATTEMPTS: ${TRANSCRIBE_RECONNECT_ATTEMPTS:-2}
      TRANSCRIBE_RECONNECT_AUDIO_BUFFER_MS: ${TRANSCRIBE_RECONNECT_AUDIO_BUFFER_MS:-3000}
      TRANSCRIBE_VAD_RMS_THRESHOLD: ${TRANSCRIBE_VAD_RMS_THRESHOLD:-600}
      POLLY_VOICE_ID: ${POLLY_VOICE_ID:-Kazuha}
      POLLY_ENGINE: ${POLLY_ENGINE:-neural}
      POLLY_MAX_PARALLEL_REQUESTS: ${POLLY_MAX_PARALLEL_REQUESTS:-2}
      VOICE_ENABLE_BACKCHANNELS: ${VOICE_ENABLE_BACKCHANNELS:-false}
      VOICE_WEBRTC_PLAYBACK_DRAIN_TIMEOUT_SECONDS: ${VOICE_WEBRTC_PLAYBACK_DRAIN_TIMEOUT_SECONDS:-5}
    volumes:
      - ..:/workspace
      - ${HOME}/.aws:/root/.aws:ro

  web:
    build:
      context: ..
      dockerfile: app/web/Dockerfile.dev
    working_dir: /workspace
    depends_on:
      - api
      - voice
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_VOICE_PROXY_TARGET: http://host.docker.internal:8010
      VITE_VOICE_RUNTIME_PROVIDER: ${VOICE_RUNTIME_PROVIDER:-transcribe_polly}
      VITE_VOICE_ICE_GATHERING_TIMEOUT_MS: ${VITE_VOICE_ICE_GATHERING_TIMEOUT_MS:-1000}
      VITE_VOICE_SIGNALING_TIMEOUT_MS: ${VITE_VOICE_SIGNALING_TIMEOUT_MS:-8000}
      CHOKIDAR_USEPOLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/app/web/node_modules

volumes:
  root-node-modules:
  web-node-modules:
