services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kikiori}
      POSTGRES_USER: ${POSTGRES_USER:-kikiori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kikiori}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kikiori} -d ${POSTGRES_DB:-kikiori}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile.dev
    working_dir: /workspace/app/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kikiori}:${POSTGRES_PASSWORD:-kikiori}@postgres:5432/${POSTGRES_DB:-kikiori}
      APP_ENV: ${APP_ENV:-local}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
      DOCUMENT_KNOWLEDGE_BACKEND: ${DOCUMENT_KNOWLEDGE_BACKEND:-postgres}
      ELASTICSEARCH_CLOUD_ID: ${ELASTICSEARCH_CLOUD_ID:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_DOCUMENT_INDEX: ${ELASTICSEARCH_DOCUMENT_INDEX:-kikiori-documents-v1}
      ELASTICSEARCH_DOCUMENT_CHUNK_INDEX: ${ELASTICSEARCH_DOCUMENT_CHUNK_INDEX:-kikiori-document-chunks-v1}
      ELASTICSEARCH_VERIFY_CERTS: ${ELASTICSEARCH_VERIFY_CERTS:-true}
      ELASTICSEARCH_REQUEST_TIMEOUT_SECONDS: ${ELASTICSEARCH_REQUEST_TIMEOUT_SECONDS:-10}
      DOCUMENT_CHUNK_SIZE_CHARS: ${DOCUMENT_CHUNK_SIZE_CHARS:-1200}
      DOCUMENT_CHUNK_OVERLAP_CHARS: ${DOCUMENT_CHUNK_OVERLAP_CHARS:-150}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      # Keep the encryption key outside the database and browser.
      OPENAI_SETTINGS_ENCRYPTION_KEY: ${OPENAI_SETTINGS_ENCRYPTION_KEY:-${GPT_LIVE_SETTINGS_ENCRYPTION_KEY:-}}
      DEV_AUTO_SEED_VOICE_DEMO: ${DEV_AUTO_SEED_VOICE_DEMO:-true}
      DEV_AUTO_SEED_MAINTENANCE_DEMO: ${DEV_AUTO_SEED_MAINTENANCE_DEMO:-true}
      DEV_AUTO_SEED_SYSTEM_REQUIREMENT_DEMO: ${DEV_AUTO_SEED_SYSTEM_REQUIREMENT_DEMO:-true}
      STRUCTURED_INTERVIEW_MODEL_ID: ${STRUCTURED_INTERVIEW_MODEL_ID:-gpt-6-luna}
      STRUCTURED_INTERVIEW_FAST_PATH_ENABLED: ${STRUCTURED_INTERVIEW_FAST_PATH_ENABLED:-false}
      STRUCTURED_INTERVIEW_FAST_MODEL_ID: ${STRUCTURED_INTERVIEW_FAST_MODEL_ID:-gpt-6-luna}
      STRUCTURED_INTERVIEW_FAST_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_FAST_REASONING_EFFORT:-none}
      STRUCTURED_INTERVIEW_FAST_MAX_OUTPUT_TOKENS: ${STRUCTURED_INTERVIEW_FAST_MAX_OUTPUT_TOKENS:-160}
      STRUCTURED_INTERVIEW_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_REASONING_EFFORT:-low}
      STRUCTURED_INTERVIEW_QUESTION_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_QUESTION_REASONING_EFFORT:-none}
      STRUCTURED_INTERVIEW_MEDIUM_REASONING_EFFORT: ${STRUCTURED_INTERVIEW_MEDIUM_REASONING_EFFORT:-medium}
      STRUCTURED_INTERVIEW_MAX_OUTPUT_TOKENS: ${STRUCTURED_INTERVIEW_MAX_OUTPUT_TOKENS:-6000}
      STRUCTURED_INTERVIEW_QUESTION_MAX_OUTPUT_TOKENS: ${STRUCTURED_INTERVIEW_QUESTION_MAX_OUTPUT_TOKENS:-600}
      QUESTION_DESIGN_MODEL_ID: ${QUESTION_DESIGN_MODEL_ID:-gpt-6-luna}
      QUESTION_DESIGN_REASONING_EFFORT: ${QUESTION_DESIGN_REASONING_EFFORT:-low}
      QUESTION_DESIGN_MAX_OUTPUT_TOKENS: ${QUESTION_DESIGN_MAX_OUTPUT_TOKENS:-6000}
      STRUCTURED_INTERVIEW_CONNECT_TIMEOUT_SECONDS: ${STRUCTURED_INTERVIEW_CONNECT_TIMEOUT_SECONDS:-5}
      STRUCTURED_INTERVIEW_READ_TIMEOUT_SECONDS: ${STRUCTURED_INTERVIEW_READ_TIMEOUT_SECONDS:-120}
    ports:
      - "${API_PORT:-8001}:8000"
    dns:
      - "${DOCKER_DNS_SERVER:-172.21.96.1}"
    volumes:
      - ..:/workspace


  web:
    build:
      context: ..
      dockerfile: app/web/Dockerfile.dev
    working_dir: /workspace
    depends_on:
      - api
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ..:/workspace
      - root-node-modules:/workspace/node_modules
      - web-node-modules:/workspace/app/web/node_modules

volumes:
  postgres-data:
  root-node-modules:
  web-node-modules:
