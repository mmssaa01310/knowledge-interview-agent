site_name: AIインタビュー Documentation
site_description: AIインタビューの仕様、現行実装、開発・運用ガイド

# docs/を唯一の公開ソースにする。docs/codebase/は実装調査用の詳細資料として
# 同じサイトから参照できる。
docs_dir: docs
site_dir: site/docs

theme:
  name: material

nav:
  - ホーム: index.md
  - プロダクト:
      - 仕様: spec.md
      - 現行実装: reference/current-implementation.md
      - UI多言語: reference/ui-localization.md
  - アーキテクチャ:
      - リアルタイム音声: architecture/voice/realtime-voice.md
      - GPT Live詳細: architecture/voice/gpt-live-phase1.md
      - 認可: architecture/access-control.md
      - AIエージェント: architecture/agents/agent-architecture.md
      - AIインタビュー構造化: architecture/agents/interview-knowledge-capture.md
      - Agentの振る舞い: agents/agent-behavior-policy.md
      - 質問設計Agent: agents/question-design-agent-strands.md
  - 開発ガイド:
      - 開発ワークフロー: guides/development-workflow.md
      - パッケージ管理: guides/package-management.md
      - リファクタリング: guides/refactoring.md
      - 検証: guides/verification.md
      - ドキュメント運用: guides/documentation.md
      - ソース配布時の情報管理: guides/source-distribution.md
  - リファレンス:
      - 技術スタック: reference/technology-stack.md
      - リポジトリ構成: reference/repository-structure.md
      - docsとspecsの管理: reference/spec-governance.md
      - 応答形式: reference/response-format.md
      - 音声E2Eケース（一般・正本）: reference/interview-voice-e2e-test-cases-general.md
      - 音声E2Eケース（システム）: reference/interview_voice_e2e_test_cases-system.md
      - 音声E2Eケース（業務フロー）: reference/interview_voice_e2e_test_cases-work-flow.md
      - 音声E2Eケース（保全）: reference/interview_voice_e2e_test_cases-hozen.md
      - 音声E2Eケース（暗黙知）: reference/interview_voice_e2e_test_cases-unmokuchi.md
  - コードベースガイド:
      - 概要: codebase/index.md
      - ビジュアルマップ: codebase/dashboard/index.html
      - アーキテクチャ: codebase/ARCHITECTURE.md
      - 構成: codebase/STRUCTURE.md
      - 技術スタック: codebase/STACK.md
      - 外部連携: codebase/INTEGRATIONS.md
      - 実装規約: codebase/CONVENTIONS.md
      - テスト: codebase/TESTING.md
      - 注意点: codebase/CONCERNS.md
  - 計画（未確定）:
      - ナレッジ分析・教育支援: plans/admin-learning-dashboard.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
