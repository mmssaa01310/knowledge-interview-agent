[project]
name = "ai-interviewer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0,<2.0.0",
  "elasticsearch>=9.0.0,<10.0.0",
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.27.0,<0.28.0",
  "openpyxl>=3.1.0,<4.0.0",
  "pypdf>=5.0.0,<7.0.0",
  "pytest>=8.2.0",
  "uvicorn>=0.30.1",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "python-docx>=1.1.0,<2.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "python-pptx>=1.0.0,<2.0.0",
  "strands-agents==1.47.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "integration: requires an external PostgreSQL instance",
]
