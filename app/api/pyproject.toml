[project]
name = "ai-interviewer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0,<2.0.0",
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.27.0,<0.28.0",
  "pytest>=8.2.0",
  "uvicorn>=0.30.1",
  "pydantic>=2.8.0",
  "strands-agents==1.47.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
