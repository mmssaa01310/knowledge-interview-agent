[project]
name = "ai-interviewer-voice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34.0,<2.0.0",
  "fastapi>=0.115.0,<0.116.0",
  "httpx>=0.27.0,<0.28.0",
  "pydantic>=2.8.0",
  "uvicorn>=0.30.1",
  "pytest>=8.2.0",
  "aws-sdk-bedrock-runtime>=0.7.0",
  "aiortc>=1.9.0,<2.0.0",
  "av>=12.3.0,<13.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
